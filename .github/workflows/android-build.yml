name: Bazar Talika AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          set -euo pipefail
          test -f BazarAndroid_Project.zip
          unzip -q -o BazarAndroid_Project.zip
          test -f BazarAndroid/gradlew
          test -f BazarAndroid/app/build.gradle
          chmod +x BazarAndroid/gradlew

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
    
      - name: Install Android SDK packages
        run: |
  
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build release AAB
        working-directory: BazarAndroid
        run: ./gradlew --no-daemon bundleRelease

      - name: Sign AAB
        id: sign
        working-directory: BazarAndroid
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p signing
          test -n "$STORE_PASS" || { echo "Missing secret: ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASS" || { echo "Missing secret: ANDROID_KEY_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing secret: ANDROID_KEY_ALIAS"; exit 1; }

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > signing/release.jks
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -v \
              -keystore signing/release.jks \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Bazar Talika, OU=App, O=Personal, L=Dhaka, ST=Dhaka, C=BD"
            base64 -w0 signing/release.jks > signing/release.jks.b64.txt
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

          jarsigner -verbose \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore signing/release.jks \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            app/build/outputs/bundle/release/app-release.aab \
            
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: BazarTalika-signed-AAB
          path: BazarAndroid/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload new signing key backup (first run only)
        if: steps.sign.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signing-backup
          path: BazarAndroid/signing
          retention-days: 1
